architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations.
    // Do NOT use other classes from fabric loader.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    modImplementation "dev.architectury:architectury:${rootProject.architectury_version}"

    // JEI common API is compileOnly so common can compile against mezz.jei.api.*
    // without pulling a platform-specific JEI jar onto its classpath.
    compileOnly("mezz.jei:jei-${rootProject.mc_version}-common-api:${rootProject.jei_version}")
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = "$rootProject.mod_id-common"
            from components.java
        }
    }
}
