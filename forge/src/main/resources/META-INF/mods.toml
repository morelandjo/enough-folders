modLoader="javafml" #mandatory
loaderVersion="${forge_loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    credits="Thanks to JEI for the inspiration"
    authors="${mod_authors}"
    description='''${mod_description}'''

    [[dependencies.${mod_id}]]
        modId="forge"
        mandatory=true
        versionRange="${forge_version_range}"
        ordering="NONE"
        side="BOTH"

    [[dependencies.${mod_id}]]
        modId="minecraft"
        mandatory=true
        versionRange="${minecraft_version_range}"
        ordering="NONE"
        side="BOTH"

    [[dependencies.${mod_id}]]
        modId="jei"
        mandatory=true
        versionRange="[11.0.0,)"
        ordering="AFTER"
        side="CLIENT"
